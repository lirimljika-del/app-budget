<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Budget</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
#splash img{width:84px;height:84px;border-radius:19px;box-shadow:0 6px 24px rgba(181,0,31,.18);animation:sp-pop .7s cubic-bezier(.2,.9,.25,1) both}
#splash .nm{font:600 20px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;letter-spacing:-.3px;color:#1a1a1a;animation:sp-up .6s .15s both}
#splash .bar{width:120px;height:3px;border-radius:3px;background:#ebe8e4;overflow:hidden;animation:sp-up .6s .25s both}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#b5001f;animation:sp-run 1.1s ease-in-out infinite}
@keyframes sp-pop{from{opacity:0;transform:scale(.8)}}
@keyframes sp-up{from{opacity:0;transform:translateY(8px)}}
@keyframes sp-run{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media (prefers-color-scheme:dark){#splash{background:#0f0f10}#splash .nm{color:#f2f1ef}#splash .bar{background:#2a292b}#splash img{box-shadow:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""><div class="nm">Budget</div><div class="bar"><i></i></div></div>
<script>window.__t0=performance.now()</script>
<div id="app" aria-live="polite"></div>
<div id="lock" class="lock hidden"></div>
<div id="toast" class="toast" role="status"></div>
<script src="engine.js"></script>
<script src="importer.js"></script>
<script src="pdf-extract.js"></script>
<script src="store.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
<script src="app-subs.js"></script>
<script src="app-import.js"></script>
</body>
</html>
